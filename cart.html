<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <script src="cart.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #cartItems div {
      display: flex;
      justify-content: space-between;
